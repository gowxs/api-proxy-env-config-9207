# Local services for development and integration tests.
# Full Supabase stack (Auth, Storage, Studio) for the web app comes from the
# Supabase CLI (`npx supabase start`) in step 12. Postgres + Storage cover steps 1-11.
name: noctiv-dev

services:
  db:
    # Same image family Supabase runs in the cloud: ships auth schema,
    # anon/authenticated/service_role roles and pgvector.
    image: supabase/postgres:17.6.1.175
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '54322:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    # Supabase Storage (same service as in the cloud) with a local file backend.
    # Local only: it connects as supabase_admin to avoid an init script; the
    # tests use the real supabase_storage_admin role.
    image: supabase/storage-api:v1.79.17
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters-long
      AUTH_JWT_ALGORITHM: HS256
      PGRST_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters-long
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      STORAGE_BACKEND: file
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: local
      TENANT_ID: local
      REGION: local
      FILE_SIZE_LIMIT: '10485760'
      UPLOAD_FILE_SIZE_LIMIT: '10485760'
      DB_INSTALL_ROLES: 'false'
      ANON_KEY: unused
      SERVICE_KEY: unused
    ports:
      - '54324:5000'
    volumes:
      - storage-data:/var/lib/storage

  greenmail:
    # IMAP/SMTP test server. Users are auto-created on first login.
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false -Dgreenmail.verbose
    ports:
      - '3025:3025' # SMTP
      - '3465:3465' # SMTPS
      - '3143:3143' # IMAP
      - '3993:3993' # IMAPS

volumes:
  db-data:
  storage-data:
