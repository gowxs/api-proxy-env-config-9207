# Local services for development and integration tests.
# Full Supabase stack (Auth, Storage, Studio) for the web app comes from the
# Supabase CLI (`npx supabase start`) in step 12. Postgres covers steps 1-11.
name: noctiv-dev

services:
  db:
    # Same image family Supabase runs in the cloud: ships auth schema,
    # anon/authenticated/service_role roles and pgvector.
    image: supabase/postgres:17.6.1.175
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '54322:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  greenmail:
    # IMAP/SMTP test server. Users are auto-created on first login.
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false -Dgreenmail.verbose
    ports:
      - '3025:3025' # SMTP
      - '3465:3465' # SMTPS
      - '3143:3143' # IMAP
      - '3993:3993' # IMAPS

volumes:
  db-data:
