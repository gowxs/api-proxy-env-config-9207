<figure class="demo" data-step="done" aria-labelledby="demo-caption">
  <div class="demo-sky" aria-hidden="true">
    <span class="demo-day" data-day>Thursday morning</span>
    <span class="demo-clock">
      <span class="demo-icon"> {{icon:moon}}{{icon:sun}} </span>
      <span data-clock>08:05</span>
    </span>
  </div>
  <div class="demo-body">
    <div class="msg msg--in">
      <div class="msg-meta"><span>Sarah M. · customer</span><time>23:41</time></div>
      Hi, is the linen throw still available in sage, and how long does delivery to Germany take?
    </div>
    <div class="msg msg--draft">
      <div class="msg-meta"><span>Noctiv · draft reply</span><time>23:42</time></div>
      Hi Sarah, yes, the linen throw is in stock in sage. Delivery to Germany takes 3–5 business
      days and costs €9.90. Would you like me to hold one for you?
      <div class="msg-src">
        {{icon:circle-check-big}}
        <span><b>Sourced:</b> Stock list, Shipping policy · no prices invented</span>
      </div>
      <div class="drafting" aria-hidden="true">
        <span class="dots"><i></i><i></i><i></i></span>Noctiv is drafting a reply
      </div>
    </div>
    <div class="approval">
      <span>Sent to you for approval</span>
      <span class="approval-state">
        <span class="pill pill--wait" aria-hidden="true">Waiting for you</span>
        <span class="pill pill--ok">{{icon:check}}Approved 08:05</span>
      </span>
    </div>
  </div>
  <figcaption>
    <span id="demo-caption"
      >Example: a customer e-mail at 23:41, a draft reply at 23:42, approved at 08:05.</span
    >
    <button class="demo-toggle" type="button" data-toggle hidden>Pause</button>
  </figcaption>
</figure>
