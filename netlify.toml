# Web app on Netlify (temporary test deployment). The API runs elsewhere;
# /api/* is forwarded by the Next.js rewrite in apps/web/next.config.ts
# (API_INTERNAL_URL, set in the Netlify project's environment).
[build]
  base = "apps/web"
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Server rendering, dynamic routes and the /api rewrite need Netlify's Next.js adapter.
[[plugins]]
  package = "@netlify/plugin-nextjs"
