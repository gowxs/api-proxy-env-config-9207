name: Web app

# Builds apps/web with OpenNext and deploys it to Cloudflare Workers (app.noctiv.io).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit).
# Pushes to main deploy to production. Until the phase-1 branch is merged,
# pushes to it deploy to production too; remove it from the list after the merge.

on:
  push:
    branches: [main, claude/noctiv-phase-1-plan-09rtlv]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 97570d018bffbb1ed393458ee52abfaa
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-time settings. All public: the API is internet-facing and the
      # publishable key ships to every browser.
      API_INTERNAL_URL: https://http--api--5sjqqqwjbjjh.code.run
      NEXT_PUBLIC_SUPABASE_URL: https://bdbztonmdfnqqlonvywn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3vm21Pbd4dLoCnkYqrez7A_V99U7aYU
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @noctiv/web
      - run: pnpm --filter @noctiv/web cf:build
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx opennextjs-cloudflare deploy
